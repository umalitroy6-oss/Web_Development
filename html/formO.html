<!DOCTYPE html>
<html>
    <head>
        <title>Form Elements</title>
        <style>
            .header{
                border:1px solid blue;
                text-align: center;
                padding:10px;
                background-color:skyblue;
                border-radius:15px;
            }
            
            
        </style>
    </head>
    <body>
        <div class="header">
        <h1>Student Information Form</h1>
        <p> Senior High School Enrollment — Grade 11</p>
        </div>
       <form action="save1.html" method="get" target="_blank">
       <fieldset>
       <legend>Personal Information</legend>
      <center> <img src="#" alt="profile photo" width="400px"/></center><br/>
        <label>First Name: </label><br/>
      <input type="text" name="fname" required>
          <span><label>Last Name: </label><br/></span>
        <input type="text" name="lname" required>
<label>Middle Initial: </label><br/>
        <input type="text" name="fname" required><br/>
        <label>Email Address: </label><br/>
        <input type="email" name="email" required>
        <label>Password: </label><br/>
        <input type="password" name="pass" maxlength="8" minlength"5" required>
        <label>Age: </label><br/>
        <input type="text" name="age" required>
        <label>Birthday: </label><br/>
        <input type="date" name="bday" required><br/>
        <label>Telephone Number: </label><br/>
        <input type="tel" name="tel" required><br/>
        <br/>
        </fieldset>
        <fieldset width="600px">
            <legend>Student Information</legend>
            <label>Student ID:</label><br/>
            <input type"text" name="SID" required><br/>
            <label>Grade Level:</label><br/>
            <input type"text" name="GL" required>
            <label>Strand:</label><br/>
            <input type"text" name="S" required>
        </fieldset>
    <fieldset>
        <legend>Additional Information</legend>
        <p>Gender</p><br/>
        <label>Male</label>
        <input type="radio" name="M">
        <label>Female</label>
        <input type="radio" name="F">
        <label>Prefer not to say</label>
        <input type="radio" name="P">
        <p>Hobbies</p><br/>
        <label>Reading</label>
        <input type="checkbox" name="R">
        <label>Coding</label>
        <input type="checkbox" name="C">
        <label>Playing sports</label>
        <input type="checkbox" name="Pl">
        <label>Watching Movies</label>
        <input type="checkbox" name="WM"><br/>
        <label>Playing Games</label>
        <input type="checkbox" name="Pl2">
        <label>Music</label>
        <input type="checkbox" name="M">
        <p>Complete Address</p>
        <textarea name="address" row="10" cols="12"></textarea><br/><br/><center><input type="submit" value="submit"><br/><input type="reset"></center>
    </fieldset>
        </form>
    </body>
</html>

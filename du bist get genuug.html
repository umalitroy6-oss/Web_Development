<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Information Form</title>
</head>

<form  action="form.html" method="get" target="_blank" style="max-width:780px; margin:0 auto; background:#ffffff; border-radius:14px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.35);">

  <div style="background:linear-gradient(135deg,#1e5f8c,#2f7fb0); color:#ffffff; text-align:center; padding:32px 24px 28px;"> </div>
    <h1 style="margin:0 0 6px; font-size:28px; font-weight:700;">Student Information Form</h1>
    <p style="margin:0; font-size:15px; opacity:0.9;">Senior High School Enrollment — Grade 11</p>
  </div>

  <div style="padding:28px 32px 32px;">

    
    <h2 style="font-size:18px; font-weight:700; color:#1e5f8c; padding-bottom:8px; border-bottom:2px solid #2f7fb0; margin:0 0 18px;">Personal Information</h2>

    <div style="background:#eef3f7; border-radius:10px; padding:22px; margin-bottom:28px;">

      <div style="width:220px; height:220px; margin:0 auto 22px; background:#ffffff; border-radius:6px; text-align:center; line-height:220px;">
        <center> <img src="https://scontent.fcgy1-3.fna.fbcdn.net/v/t1.15752-9/764299717_1579211440218101_8347319673337651494_n.jpg?_nc_cat=110&ccb=1-7&_nc_sid=fc17b8&_nc_ohc=N6eXDiPxyFkQ7kNvwEbMh4P&_nc_oc=Adrg2FrVpHezKLJe5C2BGQF5trTDViNU1f9sQrx7ZcV5piTV7meHhnJ_xMKvTf06b3w&_nc_zt=23&_nc_ht=scontent.fcgy1-3.fna&_nc_ss=7aaaf&oh=03_Q7cD6AGmspYtH3xR4GmK8cBgZTtvmnikh7VvVxTHROqCn8namA&oe=6A98E924" alt="profile photo" width="200px" length="200px"/></center><br/>
      </div>

      <table style="width:100%; border-collapse:separate; border-spacing:16px 0; margin-bottom:16px;">
        <tr>
          <td style="width:33%;">
            <label for="firstName" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter First Name" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </td>
          <td style="width:33%;">
            <label for="lastName" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter Last Name" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </td>
          <td style="width:33%;">
            <label for="middleInitial" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Middle Initial</label>
            <input type="text" id="middleInitial" name="middleInitial" placeholder="Enter Middle Name" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </td>
        </tr>
      </table>

      <table style="width:100%; border-collapse:separate; border-spacing:16px 0; margin-bottom:16px;">
        <tr>
          <td style="width:50%;">
            <label for="email" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </td>
          <td style="width:50%;">
            <label for="password" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </td>
        </tr>
      </table>

      <table style="width:100%; border-collapse:separate; border-spacing:16px 0; margin-bottom:16px;">
        <tr>
          <td style="width:50%;">
            <label for="age" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Age</label>
            <input type="number" id="age" name="age" placeholder="e.g. 16" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </td>
          <td style="width:50%;">
            <label for="birthday" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Birthday</label>
            <input type="date" id="birthday" name="birthday" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
          </td>
        </tr>
      </table>

      <div>
        <label for="contactNumber" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Contact Number</label>
        <input type="tel" id="contactNumber" name="contactNumber" placeholder="09XXXXXXXXX" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
      </div>

    </div>

  
    <h2 style="font-size:18px; font-weight:700; color:#1e5f8c; padding-bottom:8px; border-bottom:2px solid #2f7fb0; margin:0 0 18px;">Student Information</h2>

    <div style="background:#eef3f7; border-radius:10px; padding:22px; margin-bottom:28px;">

      <div style="margin-bottom:16px;">
        <label for="studentId" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Student ID</label>
        <input type="text" id="studentId" name="studentId" placeholder="e.g. 2526M00242" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box;">
      </div>

      <table style="width:100%; border-collapse:separate; border-spacing:16px 0;">
        <tr>
          <td style="width:50%;">
            <label for="gradeLevel" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Grade Level</label>
            <select id="gradeLevel" name="gradeLevel" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box; background:#ffffff;">
              <option value="">Select grade level</option>
              <option value="11">Grade 11</option>
              <option value="12">Grade 12</option>
            </select>
          </td>
          <td style="width:50%;">
            <label for="strand" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Strand</label>
            <select id="strand" name="strand" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box; background:#ffffff;">
              <option value="">Select strand</option>
              <option value="stem">STEM</option>
              <option value="abm">ABM</option>
              <option value="humss">HUMSS</option>
              <option value="gas">GAS</option>
              <option value="tvl">TVL</option>
            </select>
          </td>
        </tr>
      </table>

    </div>

    <h2 style="font-size:18px; font-weight:700; color:#1e5f8c; padding-bottom:8px; border-bottom:2px solid #2f7fb0; margin:0 0 18px;">Additional Information</h2>

    <div style="background:#eef3f7; border-radius:10px; padding:22px; margin-bottom:28px;">

      <div style="font-size:14px; font-weight:600; margin-bottom:10px;">Gender</div>
      <div style="margin-bottom:20px;">
        <label style="margin-right:24px; font-size:14px;"><input type="radio" name="gender" value="male" style="margin-right:8px;">Male</label>
        <label style="margin-right:24px; font-size:14px;"><input type="radio" name="gender" value="female" style="margin-right:8px;">Female</label>
        <label style="font-size:14px;"><input type="radio" name="gender" value="na" style="margin-right:8px;">Prefer not to say</label>
      </div>

      <div style="font-size:14px; font-weight:600; margin-bottom:10px;">Hobbies</div>
      <div style="margin-bottom:8px;">
        <label style="margin-right:24px; font-size:14px;"><input type="checkbox" name="hobbies" value="reading" style="margin-right:8px;">Reading</label>
        <label style="margin-right:24px; font-size:14px;"><input type="checkbox" name="hobbies" value="coding" style="margin-right:8px;">Coding</label>
        <label style="margin-right:24px; font-size:14px;"><input type="checkbox" name="hobbies" value="sports" style="margin-right:8px;">Playing Sports</label>
        <label style="font-size:14px;"><input type="checkbox" name="hobbies" value="movies" style="margin-right:8px;">Watching Movies</label>
      </div>
      <div style="margin-bottom:20px;">
        <label style="margin-right:24px; font-size:14px;"><input type="checkbox" name="hobbies" value="games" style="margin-right:8px;">Playing Games</label>
        <label style="font-size:14px;"><input type="checkbox" name="hobbies" value="music" style="margin-right:8px;">Music</label>
      </div>

      <label for="address" style="display:block; font-size:14px; font-weight:600; margin-bottom:6px;">Complete Address</label>
      <textarea id="address" name="address" maxlength="250" rows="4" placeholder="House No., Street, Barangay, City/Municipality, Province" style="width:100%; padding:10px 14px; border:1px solid #d7e0e7; border-radius:8px; font-size:14px; box-sizing:border-box; font-family:inherit; resize:vertical;"></textarea>
      <div style="font-size:12px; color:#7c8894; margin-top:6px;">Maximum of 250 characters.</div>

    </div>

    <div style="text-align:center;">
      <button type="submit" style="background:rgb(49, 53, 50); color:#ffffff; border:none; border-radius:24px; padding:12px 36px; font-size:15px; font-weight:700; margin-right:16px; cursor:pointer;">Submit</button>
      <button type="reset" style="background:#322f2f; color:#ffffff; border:none; border-radius:24px; padding:12px 36px; font-size:15px; font-weight:700; cursor:pointer;">Reset</button>
    </div>

  </div>

</form>

</body>
</html>

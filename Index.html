<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Activity Compilation</title>
<style>
  :root{
    --ink:#1b2430;
    --bg:#f5f6f8;
    --panel:#ffffff;
    --line:#e0e3e9;
    --accent:#ff8a3d;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    padding:40px 20px 60px;
    background:var(--bg);
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--ink);
  }

  h1{
    max-width:800px;
    margin:0 auto 32px;
    font-size:28px;
  }

  .grid{
    max-width:800px;
    margin:0 auto;
    display:grid;
    gap:20px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }

  .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }

  .tag{
    font-size:12px;
    font-weight:600;
    color:var(--accent);
  }

  .card-head h3{
    margin:0;
    font-size:16px;
    flex:1;
  }

  .card-head a{
    font-size:13px;
    color:var(--accent);
    text-decoration:none;
  }

  .card-head a:hover{
    text-decoration:underline;
  }

  iframe{
    display:block;
    width:100%;
    height:350px;
    border:0;
  }
</style>
</head>
<body>

  <h1>Activity Compilation</h1>

  <div class="grid">

    <div class="card">
      <div class="card-head">
        <span class="tag">02</span>
        <h3>List Attributes And Values</h3>
        <a href="WW2 (1).png" target="list-attribute-values">Open</a>
      </div>
      <iframe name="list-attribute-values"></iframe>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="tag">03</span>
        <h3>Webpage Layout Design</h3>
        <a href="ACT3.html" target="Webpage Layout Design">Open</a>
      </div>
      <iframe name="Webpage Layout Design"></iframe>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="tag">04</span>
        <h3>List Attributes</h3>
        <a href="ww4.html" target="list-attribute">Open</a>
      </div>
      <iframe name="list-attribute"></iframe>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="tag">05</span>
        <h3>Class Schedule Table</h3>
        <a href="act5.html" target="Class Schedule Table">Open</a>
      </div>
      <iframe name="Class Schedule Table"></iframe>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="tag">06</span>
        <h3>CPU Scheduling</h3>
        <a href="act6.html" target="CPU Scheduling">Open</a>
      </div>
      <iframe name="CPU Scheduling"></iframe>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="tag">07</span>
        <h3>Restaurant Menu Table</h3>
        <a href="7.html" target="Restaurant Menu Table">Open</a>
      </div>
      <iframe name="Restaurant Menu Table"></iframe>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="tag">08</span>
        <h3>Personal Data Sheet</h3>
        <a href="8.html" target="Personal Data Sheet">Open</a>
      </div>
      <iframe name="Personal Data Sheet"></iframe>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="tag">09</span>
        <h3>Student Information Form</h3>
        <a href="9.html" target="Student Information Form">Open</a>
      </div>
      <iframe name="Student Information Form"></iframe>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="tag">10</span>
        <h3>HTML Compilation</h3>
        <a href="10.html" target="HTML Compilation">Open</a>
      </div>
      <iframe name="HTML Compilation"></iframe>
    </div>

  </div>

</body>
</html>
